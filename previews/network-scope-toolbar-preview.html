<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GRNScope Network Scope Toolbar Preview</title>
  <style>
    :root {
      --blue: #1b75a6;
      --blue-soft: #f2f9fc;
      --ink: #0f172a;
      --muted: #42526a;
      --line: #d8e4ef;
      --panel: #f4f7fb;
      --node: #344154;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7fbff;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      padding: 40px 52px;
    }

    .section {
      max-width: 1280px;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 34px;
      background: white;
      padding: 34px 30px 30px;
      box-shadow: 0 18px 55px rgba(39, 67, 93, 0.08);
    }

    .heading {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 0 0 28px;
    }

    .heading h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .help {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 2px solid #bfe1f2;
      border-radius: 999px;
      background: #f2fbff;
      color: var(--blue);
      font-size: 22px;
      font-weight: 900;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) 360px;
      gap: 30px;
      align-items: start;
    }

    .network-card {
      position: relative;
      min-height: 500px;
      overflow: hidden;
      border: 2px solid var(--line);
      border-radius: 34px;
      background:
        linear-gradient(90deg, rgba(194, 211, 226, 0.24) 1px, transparent 1px),
        linear-gradient(rgba(194, 211, 226, 0.24) 1px, transparent 1px),
        #f5f7fa;
      background-size: 52px 52px;
      box-shadow: inset 0 0 0 1px rgba(222, 232, 241, 0.85);
    }

    .toolbar {
      position: absolute;
      z-index: 5;
      left: 28px;
      right: 28px;
      top: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
    }

    .layout-tabs {
      display: inline-flex;
      align-items: center;
      min-height: 66px;
      border: 2px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.96);
      padding: 5px;
      box-shadow: 0 12px 26px rgba(38, 66, 93, 0.07);
      pointer-events: auto;
    }

    .layout-tabs {
      gap: 4px;
    }

    .tab {
      min-width: 78px;
      height: 52px;
      border: 0;
      border-radius: 18px;
      background: transparent;
      color: var(--muted);
      padding: 0 16px;
      font-size: 18px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .tab.active {
      background: var(--blue);
      color: white;
    }

    .actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .scope-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      height: 66px;
    }

    .scope-select {
      height: 66px;
      min-width: 178px;
      max-width: 245px;
      appearance: none;
      border: 2px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.96);
      color: #334155;
      padding: 0 38px 0 16px;
      font-size: 16px;
      font-weight: 800;
      outline: none;
      box-shadow: 0 12px 26px rgba(38, 66, 93, 0.07);
    }

    .scope-pill::after {
      content: "";
      position: absolute;
      right: 17px;
      top: 27px;
      width: 8px;
      height: 8px;
      border-bottom: 2px solid #64748b;
      border-right: 2px solid #64748b;
      transform: rotate(45deg);
      pointer-events: none;
    }

    .download {
      height: 66px;
      border: 2px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.96);
      color: #475569;
      padding: 0 24px;
      font-size: 17px;
      font-weight: 850;
      box-shadow: 0 12px 26px rgba(38, 66, 93, 0.07);
    }

    .download:hover,
    .scope-select:hover {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .node {
      position: absolute;
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      background: var(--node);
      color: white;
      font-size: 8px;
      font-weight: 900;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.18);
    }

    .diamond {
      border-radius: 0;
      transform: rotate(45deg);
    }

    .diamond span {
      transform: rotate(-45deg);
    }

    .edge {
      position: absolute;
      height: 3px;
      background: #8290a3;
      transform-origin: left center;
      opacity: 0.88;
    }

    .edge.thin {
      height: 2px;
      opacity: 0.62;
    }

    .a { left: 230px; top: 245px; }
    .b { left: 350px; top: 245px; }
    .c { left: 475px; top: 245px; }
    .d { left: 600px; top: 240px; }
    .e { left: 720px; top: 245px; }
    .f { left: 815px; top: 165px; }
    .g { left: 890px; top: 300px; }
    .h { left: 775px; top: 350px; }

    .ab { left: 275px; top: 267px; width: 95px; }
    .bc { left: 395px; top: 267px; width: 97px; }
    .cd { left: 520px; top: 267px; width: 96px; transform: rotate(-2deg); }
    .de { left: 645px; top: 267px; width: 94px; transform: rotate(3deg); }
    .ef { left: 738px; top: 248px; width: 91px; transform: rotate(-66deg); }
    .eg { left: 748px; top: 276px; width: 136px; transform: rotate(25deg); }
    .eh { left: 740px; top: 285px; width: 104px; transform: rotate(74deg); }

    .inspect {
      min-height: 500px;
      border: 2px solid var(--line);
      border-radius: 34px;
      background: #fbfdff;
      padding: 36px 30px;
    }

    .inspect h2 {
      margin: 0 0 26px;
      font-size: 28px;
      letter-spacing: 0;
    }

    .empty {
      display: flex;
      min-height: 212px;
      align-items: center;
      border: 2px dashed #cbd8e6;
      border-radius: 28px;
      color: #42526a;
      padding: 34px;
      font-size: 24px;
      line-height: 1.55;
    }

    @media (max-width: 1080px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        align-self: flex-end;
      }
    }

    @media (max-width: 760px) {
      .page {
        padding: 18px;
      }

      .section {
        padding: 24px 18px;
      }

      .toolbar {
        left: 14px;
        right: 14px;
        top: 14px;
      }

      .layout-tabs {
        width: 100%;
        flex-wrap: wrap;
      }

      .actions {
        width: 100%;
      }

      .tab {
        min-width: 0;
        flex: 1;
        padding: 10px 8px;
        font-size: 13px;
      }

      .scope-pill,
      .scope-select,
      .download {
        flex: 1;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="section">
      <div class="heading">
        <h1>Network Visualization</h1>
        <span class="help">?</span>
      </div>

      <div class="layout">
        <div class="network-card">
          <div class="toolbar">
            <div class="layout-tabs" aria-label="Layout selection">
              <button class="tab active">Force</button>
              <button class="tab">Hierarchical</button>
              <button class="tab">Concentric</button>
              <button class="tab">Circular</button>
              <button class="tab">Circos</button>
            </div>

            <div class="actions">
              <label class="scope-pill">
                <span style="position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden;">Cluster scope</span>
                <select class="scope-select" aria-label="Cluster scope">
                  <option>Global</option>
                  <option selected>erythroid (864)</option>
                  <option>myeloid (512)</option>
                  <option>lymphoid (219)</option>
                </select>
              </label>
              <button class="download">Download</button>
            </div>
          </div>

          <span class="edge ab"></span>
          <span class="edge thin bc"></span>
          <span class="edge cd"></span>
          <span class="edge de"></span>
          <span class="edge ef"></span>
          <span class="edge thin eg"></span>
          <span class="edge eh"></span>

          <span class="node a">WNT4</span>
          <span class="node diamond b"><span>NROB1</span></span>
          <span class="node c">UGR</span>
          <span class="node diamond d"><span>CBX2</span></span>
          <span class="node diamond e"><span>NR5A1</span></span>
          <span class="node f">RSP01</span>
          <span class="node g">CTNNB1</span>
          <span class="node diamond h"><span>FOXL2</span></span>
        </div>

        <aside class="inspect">
          <h2>Node Inspection</h2>
          <div class="empty">
            Click a node to inspect gene details, or click an edge to inspect evidence, confidence, sign, and supporting algorithms.
          </div>
        </aside>
      </div>
    </section>
  </main>
</body>
</html>
