svg.addEventListener("mouseleave", () => { if (hover) { hover = null; draw(); } });
svg.addEventListener("click", e => { const k = keyOf(e); if (!k) return; const [kind, g] = k.split(":");
  if (kind === "M") { if (!selM.has(g)) { selM.add(g); focus = g; } else if (focus !== g) focus = g; else { selM.delete(g); focus = [...selM].pop() || null; } }
  else if (kind === "L") { const key = g + "|" + focus; selL.has(key) ? selL.delete(key) : selL.add(key); }
  draw(); });
const sel = document.getElementById("target");
sel.innerHTML = TARGETS.map(g => `<option value="${g}">${g} · ${regsOf(g).length} regulator${regsOf(g).length === 1 ? "" : "s"}</option>`).join("");
sel.value = target;
const reset = () => { const M = mids(); let best = null; M.forEach(b => upsOf(b).forEach(a => { const ok = ONSET[a] < ONSET[b] && ONSET[b] < ONSET[target], sc = (ok ? 100 : 0) + support(a, b) + support(b, target); if (!best || sc > best.sc) best = { a, b, sc }; })); selM = new Set(best ? [best.b] : M.slice(0, 1)); focus = [...selM][0] || null; selL = new Set(best ? [best.a + "|" + best.b] : []); };
sel.onchange = () => { target = sel.value; reset(); draw(); };
document.getElementById("all").onclick = () => { selM = new Set(mids()); if (!focus) focus = mids()[0] || null; draw(); };
document.getElementById("clear").onclick = () => { selM = new Set(); selL = new Set(); focus = null; draw(); };
reset(); draw();
</script>
