<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence and confidence preview</title>
<style>
  body { margin: 0; padding: 24px 16px 40px; background: #fff; color: #1a1a1a; font: 12px/1.45 Arial, Helvetica, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: #4b5560; margin: 0 0 18px; max-width: 760px; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
  .fig { width: 340px; max-width: 100%; }
  .fig h2 { font-size: 13px; margin: 0 0 6px; }
  svg { display: block; width: 100%; height: auto; font-family: Arial, Helvetica, sans-serif; }
  .bar { cursor: default; }
  .bar:hover { fill: #087ead; }
  .note { min-height: 18px; margin: 4px 0 0; font-size: 11.5px; color: #4b5560; }
</style>
</head>
<body>
<h1>Evidence and confidence on one 0–1 axis</h1>
<p class="sub">Your 19-gene project (2e40f8acffeb), 29 displayed links. Every chart uses one x-axis from 0 to 1 and counts links in 0.05-wide bins. Hover a bar for its count.</p>

<div class="row">
  <div class="fig"><h2>A · Mirrored</h2><svg id="a" viewBox="0 0 340 300"></svg><p class="note" id="na"></p></div>
  <div class="fig"><h2>B · Two panels, one axis</h2><svg id="b" viewBox="0 0 340 300"></svg><p class="note" id="nb"></p></div>
  <div class="fig"><h2>C · Side by side</h2><svg id="c" viewBox="0 0 340 300"></svg><p class="note" id="nc"></p></div>
</div>

<script>
const ROWS = [[0.74,1],[0.739,1],[0.738,1],[0.738,1],[0.735,1],[0.735,1],[0.715,1],[0.714,1],[0.693,1],[0.688,1],[0.682,1],[0.681,1],[0.68,1],[0.675,1],[0.669,1],[0.646,1],[0.67,0.9],[0.659,0.9],[0.777,0.833],[0.779,0.8],[0.647,0.8],[0.647,0.8],[0.715,0.7],[0.701,0.667],[0.677,0.667],[0.643,0.633],[0.643,0.6],[0.678,0.6],[0.728,0.467]];
const STEP = 0.05, N = 20;
const bin = v => Math.min(N - 1, Math.max(0, Math.floor(v / STEP + 1e-9)));
const ev = Array(N).fill(0), cf = Array(N).fill(0);
ROWS.forEach(([e, c]) => { ev[bin(e)]++; cf[bin(c)]++; });
const EV = "rgb(33,113,181)", CF = "rgb(253,141,60)", INK = "#1a1a1a", SUB = "#4b5560", GRID = "#e9edf0";
const X0 = 44, X1 = 326, slot = (X1 - X0) / N;
const nice = peak => { const t = Math.max(1, Math.ceil(peak / 4)); return [Math.ceil(peak / t) * t, t]; };
const range = i => `${(i * STEP).toFixed(2)}–${((i + 1) * STEP).toFixed(2)}`;
const key = (x, y, items) => items.map(([c, name], k) => `<rect x="${x + k * 92}" y="${y}" width="10" height="10" fill="${c}"/><text x="${x + k * 92 + 14}" y="${y + 9}" font-size="10" fill="${INK}">${name}</text>`).join("");
const xAxis = (y, label = true) => {
  let s = `<line x1="${X0}" x2="${X1}" y1="${y}" y2="${y}" stroke="${INK}" stroke-width="0.8"/>`;
  for (let t = 0; t <= 10; t++) { const x = X0 + (t / 10) * (X1 - X0); s += `<line x1="${x}" x2="${x}" y1="${y}" y2="${y + 4}" stroke="${INK}" stroke-width="0.8"/>`; if (label && t % 2 === 0) s += `<text x="${x}" y="${y + 16}" font-size="11" text-anchor="middle" fill="${INK}">${(t / 10).toFixed(1)}</text>`; }
  return s;
};
const yAxis = (y0, y1, max, tick, flip = false) => {
  let s = `<line x1="${X0}" x2="${X0}" y1="${Math.min(y0, y1)}" y2="${Math.max(y0, y1)}" stroke="${INK}" stroke-width="0.8"/>`;
  for (let v = flip ? tick : 0; v <= max; v += tick) { const y = y0 + (v / max) * (y1 - y0); s += `<line x1="${X0}" x2="${X1}" y1="${y}" y2="${y}" stroke="${GRID}" stroke-width="0.8"/><line x1="${X0 - 4}" x2="${X0}" y1="${y}" y2="${y}" stroke="${INK}" stroke-width="0.8"/><text x="${X0 - 7}" y="${y + 3.8}" font-size="11" text-anchor="end" fill="${INK}">${v}</text>`; }
  return s;
};
const bars = (vals, fill, y0, y1, max, name, x = i => X0 + i * slot + 1, w = slot - 2) => vals.map((n, i) => {
  if (!n) return "";
  const y = y0 + (n / max) * (y1 - y0);
  return `<rect class="bar" data-t="${name} ${range(i)}: ${n} link${n === 1 ? "" : "s"}" x="${x(i)}" y="${Math.min(y, y0)}" width="${w}" height="${Math.abs(y - y0)}" fill="${fill}"/>`;
}).join("");
const yTitle = (y, text) => `<text transform="translate(13 ${y}) rotate(-90)" font-size="12" text-anchor="middle" fill="${INK}">${text}</text>`;
const xTitle = y => `<text x="${(X0 + X1) / 2}" y="${y}" font-size="12" text-anchor="middle" fill="${INK}">Score (0–1)</text>`;
const [max, tick] = nice(Math.max(...ev, ...cf));

// A: evidence up, confidence down, around a shared axis.
{
  const mid = 146, top = 36, bot = 256;
  let s = key(4, 6, [[EV, "Evidence"], [CF, "Confidence"]]);
  s += yAxis(mid, top, max, tick) + yAxis(mid, bot, max, tick, true);
  s += bars(ev, EV, mid, top, max, "Evidence") + bars(cf, CF, mid, bot, max, "Confidence");
  s += `<line x1="${X0}" x2="${X1}" y1="${mid}" y2="${mid}" stroke="${INK}" stroke-width="0.8"/>` + xAxis(bot + 4) + xTitle(bot + 38);
  s += yTitle(mid, "Number of links");
  document.getElementById("a").innerHTML = s;
}
// B: two panels stacked on one x-axis.
{
  const t1 = 26, b1 = 122, t2 = 152, b2 = 248;
  let s = `<text x="${X0}" y="16" font-size="11.5" fill="${SUB}">Evidence</text><text x="${X0}" y="${t2 - 10}" font-size="11.5" fill="${SUB}">Confidence</text>`;
  s += yAxis(b1, t1, max, tick) + yAxis(b2, t2, max, tick);
  s += bars(ev, EV, b1, t1, max, "Evidence") + bars(cf, CF, b2, t2, max, "Confidence");
  s += xAxis(b1 + 4, false) + xAxis(b2 + 4) + xTitle(b2 + 40) + yTitle((t1 + b2) / 2, "Number of links");
  document.getElementById("b").innerHTML = s;
}
// C: both in one plot, side by side in each bin.
{
  const top = 40, bot = 248, w = (slot - 2) / 2;
  let s = key(4, 6, [[EV, "Evidence"], [CF, "Confidence"]]);
  s += yAxis(bot, top, max, tick);
  s += bars(ev, EV, bot, top, max, "Evidence", i => X0 + i * slot + 1, w) + bars(cf, CF, bot, top, max, "Confidence", i => X0 + i * slot + 1 + w, w);
  s += xAxis(bot + 4) + xTitle(bot + 40) + yTitle((top + bot) / 2, "Number of links");
  document.getElementById("c").innerHTML = s;
}
for (const id of ["a", "b", "c"]) {
  const note = document.getElementById("n" + id);
  document.getElementById(id).querySelectorAll(".bar").forEach(el => { el.onmouseenter = () => note.textContent = el.dataset.t; el.onmouseleave = () => note.textContent = ""; });
}
</script>
</body>
</html>
