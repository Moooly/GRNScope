  svg.querySelectorAll(".hit").forEach(n => n.onclick = () => { const g = n.dataset.g, k = n.dataset.kind; if (k === "M") { selB = g; if (!(selA && selA !== g && has(selA, g))) selA = null; } else if (k === "L") { const bs = M.filter(b => b !== g && has(g, b)); selA = g; if (!bs.includes(selB)) selB = bs.sort((x, y) => support(g, y) - support(g, x))[0]; } draw(); });
}
const sel = document.getElementById("target");
sel.innerHTML = TARGETS.map(g => `<option value="${g}">${g} · ${regsOf(g).length} regulator${regsOf(g).length === 1 ? "" : "s"}</option>`).join("");
sel.value = target;
const reset = () => { const M = mids(); let best = null; M.forEach(b => regsOf(b).forEach(a => { if (a === target || a === b) return; const ok = ONSET[a] < ONSET[b] && ONSET[b] < ONSET[target], sc = (ok ? 100 : 0) + support(a, b) + support(b, target); if (!best || sc > best.sc) best = { a, b, sc }; })); selA = best ? best.a : null; selB = best ? best.b : M[0] || null; };
sel.onchange = () => { target = sel.value; reset(); draw(); };
reset(); draw();
</script>
</body>
