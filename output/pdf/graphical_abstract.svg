<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="10in" height="4in" viewBox="0 0 3000 1200"
     role="img" aria-labelledby="ga-title ga-desc">
  <title id="ga-title">GRNScope graphical abstract</title>
  <desc id="ga-desc">A left-to-right workflow showing single-cell expression input, data preparation, multi-method network inference with bootstrap resampling, stability assessment, and an interactive consensus regulatory network.</desc>

  <defs>
    <marker id="arrow" markerWidth="46" markerHeight="36" refX="42" refY="18" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 46 36">
      <path d="M2,2 L44,18 L2,34 Z" fill="#1B75A6"/>
    </marker>
    <marker id="small-arrow" markerWidth="24" markerHeight="20" refX="21" refY="10" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 24 20">
      <path d="M1,1 L23,10 L1,19 Z" fill="#123B56"/>
    </marker>
    <style>
      .title { font: 700 84px Arial, Helvetica, sans-serif; fill: #123B56; }
      .subtitle { font: 400 54px Arial, Helvetica, sans-serif; fill: #3F5F70; }
      .stage { font: 700 54px Arial, Helvetica, sans-serif; letter-spacing: 2px; fill: #123B56; }
      .label { font: 600 50px Arial, Helvetica, sans-serif; fill: #294A5D; }
      .compact-label { font: 700 44px Arial, Helvetica, sans-serif; fill: #294A5D; }
      .footer { font: 700 62px Arial, Helvetica, sans-serif; fill: #123B56; }
      .panel { fill: #FFFFFF; stroke: #C9DFEA; stroke-width: 5; }
      .icon-line { fill: none; stroke: #1B75A6; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
      .navy-line { fill: none; stroke: #123B56; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
      .muted-line { fill: none; stroke: #A9C2CF; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
      .stable-line { fill: none; stroke: #0F8F83; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
      .variable-line { fill: none; stroke: #E58F46; stroke-width: 10; stroke-linecap: round; stroke-dasharray: 18 15; opacity: 0.72; }
    </style>
  </defs>

  <rect x="0" y="0" width="3000" height="1200" fill="#F7FBFD"/>

  <!-- Header -->
  <text class="title" x="86" y="112">GRNScope</text>
  <text class="subtitle" x="650" y="108">Stability-aware, multi-method regulatory network inference</text>
  <line x1="86" y1="154" x2="2914" y2="154" stroke="#BBD7E4" stroke-width="5"/>

  <!-- Stage panels -->
  <rect class="panel" x="76" y="220" width="430" height="720" rx="36"/>
  <rect class="panel" x="618" y="220" width="430" height="720" rx="36"/>
  <rect class="panel" x="1160" y="220" width="560" height="720" rx="36"/>
  <rect class="panel" x="1832" y="220" width="470" height="720" rx="36"/>
  <rect class="panel" x="2414" y="220" width="510" height="720" rx="36"/>

  <!-- Connecting arrows -->
  <line x1="518" y1="580" x2="602" y2="580" stroke="#1B75A6" stroke-width="15" marker-end="url(#arrow)"/>
  <line x1="1060" y1="580" x2="1144" y2="580" stroke="#1B75A6" stroke-width="15" marker-end="url(#arrow)"/>
  <line x1="1732" y1="580" x2="1816" y2="580" stroke="#1B75A6" stroke-width="15" marker-end="url(#arrow)"/>
  <line x1="2314" y1="580" x2="2398" y2="580" stroke="#1B75A6" stroke-width="15" marker-end="url(#arrow)"/>

  <!-- 1. Input -->
  <text class="stage" x="291" y="300" text-anchor="middle">INPUT</text>

  <!-- Heatmap matrix -->
  <g transform="translate(139 350)">
    <rect x="0" y="0" width="304" height="226" rx="20" fill="#EAF5FA" stroke="#90BDD1" stroke-width="6"/>
    <g stroke="#FFFFFF" stroke-width="5">
      <rect x="25" y="24" width="42" height="42" rx="5" fill="#D9EEF5"/>
      <rect x="70" y="24" width="42" height="42" rx="5" fill="#7AB9D2"/>
      <rect x="115" y="24" width="42" height="42" rx="5" fill="#1B75A6"/>
      <rect x="160" y="24" width="42" height="42" rx="5" fill="#B7DCE9"/>
      <rect x="205" y="24" width="42" height="42" rx="5" fill="#3F91B6"/>
      <rect x="250" y="24" width="29" height="42" rx="5" fill="#E58F46"/>

      <rect x="25" y="69" width="42" height="42" rx="5" fill="#3F91B6"/>
      <rect x="70" y="69" width="42" height="42" rx="5" fill="#E58F46"/>
      <rect x="115" y="69" width="42" height="42" rx="5" fill="#D9EEF5"/>
      <rect x="160" y="69" width="42" height="42" rx="5" fill="#1B75A6"/>
      <rect x="205" y="69" width="42" height="42" rx="5" fill="#76B5A9"/>
      <rect x="250" y="69" width="29" height="42" rx="5" fill="#B7DCE9"/>

      <rect x="25" y="114" width="42" height="42" rx="5" fill="#B7DCE9"/>
      <rect x="70" y="114" width="42" height="42" rx="5" fill="#1B75A6"/>
      <rect x="115" y="114" width="42" height="42" rx="5" fill="#E58F46"/>
      <rect x="160" y="114" width="42" height="42" rx="5" fill="#D9EEF5"/>
      <rect x="205" y="114" width="42" height="42" rx="5" fill="#3F91B6"/>
      <rect x="250" y="114" width="29" height="42" rx="5" fill="#76B5A9"/>

      <rect x="25" y="159" width="42" height="42" rx="5" fill="#E58F46"/>
      <rect x="70" y="159" width="42" height="42" rx="5" fill="#D9EEF5"/>
      <rect x="115" y="159" width="42" height="42" rx="5" fill="#76B5A9"/>
      <rect x="160" y="159" width="42" height="42" rx="5" fill="#3F91B6"/>
      <rect x="205" y="159" width="42" height="42" rx="5" fill="#1B75A6"/>
      <rect x="250" y="159" width="29" height="42" rx="5" fill="#D9EEF5"/>
    </g>
  </g>
  <text class="label" x="291" y="655" text-anchor="middle">Expression data</text>

  <!-- Optional context icons -->
  <g transform="translate(138 700)">
    <!-- pseudotime -->
    <circle cx="50" cy="56" r="47" fill="#EEF7FB" stroke="#90BDD1" stroke-width="5"/>
    <path d="M18 75 C30 36, 48 88, 78 28" class="icon-line" stroke-width="8"/>
    <!-- clusters -->
    <circle cx="152" cy="56" r="47" fill="#EEF7FB" stroke="#90BDD1" stroke-width="5"/>
    <circle cx="136" cy="45" r="13" fill="#7C6BC2"/>
    <circle cx="165" cy="38" r="13" fill="#0F8F83"/>
    <circle cx="162" cy="69" r="13" fill="#E58F46"/>
    <circle cx="132" cy="74" r="13" fill="#1B75A6"/>
    <!-- reference network -->
    <circle cx="254" cy="56" r="47" fill="#EEF7FB" stroke="#90BDD1" stroke-width="5"/>
    <line x1="229" y1="73" x2="249" y2="42" class="navy-line" stroke-width="7"/>
    <line x1="251" y1="42" x2="279" y2="64" class="navy-line" stroke-width="7"/>
    <circle cx="226" cy="76" r="11" fill="#1B75A6"/>
    <circle cx="252" cy="38" r="11" fill="#0F8F83"/>
    <circle cx="282" cy="67" r="11" fill="#E58F46"/>
  </g>
  <text class="label" x="291" y="862" text-anchor="middle">Optional context</text>

  <!-- 2. Prepare -->
  <text class="stage" x="833" y="300" text-anchor="middle">PREPARE</text>

  <!-- Validate icon -->
  <g transform="translate(670 350)">
    <rect x="0" y="0" width="112" height="112" rx="24" fill="#EAF5FA" stroke="#90BDD1" stroke-width="6"/>
    <path d="M25 57 L48 80 L88 31" class="stable-line" stroke-width="14"/>
    <text class="label" x="130" y="76">Validate</text>
  </g>

  <!-- Transform icon -->
  <g transform="translate(670 520)">
    <rect x="0" y="0" width="112" height="112" rx="24" fill="#EAF5FA" stroke="#90BDD1" stroke-width="6"/>
    <path d="M22 76 C41 22, 71 91, 91 38" class="icon-line" stroke-width="9"/>
    <path d="M74 31 L93 37 L90 58" class="icon-line" stroke-width="8"/>
    <text class="label" x="130" y="76">Transform</text>
  </g>

  <!-- Select icon -->
  <g transform="translate(670 690)">
    <rect x="0" y="0" width="112" height="112" rx="24" fill="#EAF5FA" stroke="#90BDD1" stroke-width="6"/>
    <path d="M20 27 H92 L65 59 V91 L47 81 V59 Z" fill="#1B75A6"/>
    <text class="label" x="130" y="55">Select</text>
    <text class="label" x="130" y="108">genes</text>
  </g>

  <!-- 3. Multi-method inference -->
  <text class="stage" x="1440" y="292" text-anchor="middle">MULTI-METHOD</text>
  <text class="stage" x="1440" y="350" text-anchor="middle">INFERENCE</text>

  <!-- Parallel method cards -->
  <g transform="translate(1220 398)">
    <rect x="0" y="0" width="132" height="150" rx="22" fill="#F0EEFA" stroke="#7C6BC2" stroke-width="6"/>
    <line x1="31" y1="106" x2="67" y2="46" stroke="#7C6BC2" stroke-width="9" marker-end="url(#small-arrow)"/>
    <line x1="68" y1="48" x2="104" y2="101" stroke="#7C6BC2" stroke-width="9"/>
    <circle cx="28" cy="111" r="15" fill="#7C6BC2"/>
    <rect x="54" y="29" width="29" height="29" rx="4" fill="#7C6BC2" transform="rotate(45 68.5 43.5)"/>
    <circle cx="106" cy="105" r="15" fill="#7C6BC2"/>

    <rect x="154" y="0" width="132" height="150" rx="22" fill="#E8F6F4" stroke="#0F8F83" stroke-width="6"/>
    <line x1="183" y1="47" x2="221" y2="106" stroke="#0F8F83" stroke-width="9" marker-end="url(#small-arrow)"/>
    <line x1="221" y1="105" x2="259" y2="54" stroke="#0F8F83" stroke-width="9"/>
    <circle cx="181" cy="43" r="15" fill="#0F8F83"/>
    <circle cx="221" cy="109" r="15" fill="#0F8F83"/>
    <rect x="245" y="39" width="29" height="29" rx="4" fill="#0F8F83" transform="rotate(45 259.5 53.5)"/>

    <rect x="308" y="0" width="132" height="150" rx="22" fill="#FFF2E7" stroke="#E58F46" stroke-width="6"/>
    <line x1="337" y1="110" x2="374" y2="46" stroke="#E58F46" stroke-width="9"/>
    <line x1="375" y1="47" x2="413" y2="109" stroke="#E58F46" stroke-width="9" marker-end="url(#small-arrow)"/>
    <circle cx="335" cy="113" r="15" fill="#E58F46"/>
    <circle cx="375" cy="42" r="15" fill="#E58F46"/>
    <circle cx="415" cy="113" r="15" fill="#E58F46"/>
  </g>
  <text class="label" x="1440" y="610" text-anchor="middle">Multiple methods</text>

  <!-- Bootstrap resampling -->
  <g transform="translate(1283 675)">
    <rect x="0" y="0" width="90" height="92" rx="14" fill="#EAF5FA" stroke="#90BDD1" stroke-width="5"/>
    <g fill="#1B75A6">
      <rect x="17" y="17" width="15" height="15" rx="3"/><rect x="38" y="17" width="15" height="15" rx="3"/><rect x="59" y="17" width="15" height="15" rx="3"/>
      <rect x="17" y="38" width="15" height="15" rx="3" opacity=".35"/><rect x="38" y="38" width="15" height="15" rx="3"/><rect x="59" y="38" width="15" height="15" rx="3" opacity=".55"/>
      <rect x="17" y="59" width="15" height="15" rx="3"/><rect x="38" y="59" width="15" height="15" rx="3" opacity=".35"/><rect x="59" y="59" width="15" height="15" rx="3"/>
    </g>
    <rect x="112" y="0" width="90" height="92" rx="14" fill="#E8F6F4" stroke="#76B5A9" stroke-width="5"/>
    <g fill="#0F8F83" transform="translate(112 0)">
      <rect x="17" y="17" width="15" height="15" rx="3" opacity=".45"/><rect x="38" y="17" width="15" height="15" rx="3"/><rect x="59" y="17" width="15" height="15" rx="3"/>
      <rect x="17" y="38" width="15" height="15" rx="3"/><rect x="38" y="38" width="15" height="15" rx="3" opacity=".35"/><rect x="59" y="38" width="15" height="15" rx="3"/>
      <rect x="17" y="59" width="15" height="15" rx="3"/><rect x="38" y="59" width="15" height="15" rx="3"/><rect x="59" y="59" width="15" height="15" rx="3" opacity=".45"/>
    </g>
    <rect x="224" y="0" width="90" height="92" rx="14" fill="#FFF2E7" stroke="#E8AD76" stroke-width="5"/>
    <g fill="#E58F46" transform="translate(224 0)">
      <rect x="17" y="17" width="15" height="15" rx="3"/><rect x="38" y="17" width="15" height="15" rx="3" opacity=".4"/><rect x="59" y="17" width="15" height="15" rx="3"/>
      <rect x="17" y="38" width="15" height="15" rx="3"/><rect x="38" y="38" width="15" height="15" rx="3"/><rect x="59" y="38" width="15" height="15" rx="3" opacity=".35"/>
      <rect x="17" y="59" width="15" height="15" rx="3" opacity=".45"/><rect x="38" y="59" width="15" height="15" rx="3"/><rect x="59" y="59" width="15" height="15" rx="3"/>
    </g>
  </g>
  <text class="label" x="1440" y="855" text-anchor="middle">Bootstrap resampling</text>

  <!-- 4. Stability assessment -->
  <text class="stage" x="2067" y="292" text-anchor="middle">ASSESS</text>
  <text class="stage" x="2067" y="350" text-anchor="middle">STABILITY</text>

  <!-- Repeated network runs -->
  <g transform="translate(1885 397)">
    <circle cx="80" cy="78" r="70" fill="#EEF7FB" stroke="#90BDD1" stroke-width="6"/>
    <circle cx="286" cy="78" r="70" fill="#EEF7FB" stroke="#90BDD1" stroke-width="6"/>
    <circle cx="80" cy="255" r="70" fill="#EEF7FB" stroke="#90BDD1" stroke-width="6"/>
    <circle cx="286" cy="255" r="70" fill="#EEF7FB" stroke="#90BDD1" stroke-width="6"/>

    <g>
      <line x1="42" y1="105" x2="80" y2="49" class="stable-line"/>
      <line x1="80" y1="49" x2="119" y2="103" class="variable-line"/>
      <circle cx="39" cy="109" r="13" fill="#0F8F83"/><circle cx="80" cy="45" r="13" fill="#0F8F83"/><circle cx="122" cy="107" r="13" fill="#E58F46"/>

      <line x1="248" y1="105" x2="286" y2="49" class="stable-line"/>
      <line x1="286" y1="49" x2="325" y2="103" class="muted-line"/>
      <circle cx="245" cy="109" r="13" fill="#0F8F83"/><circle cx="286" cy="45" r="13" fill="#0F8F83"/><circle cx="328" cy="107" r="13" fill="#A9C2CF"/>

      <line x1="42" y1="282" x2="80" y2="226" class="stable-line"/>
      <line x1="80" y1="226" x2="119" y2="280" class="variable-line"/>
      <circle cx="39" cy="286" r="13" fill="#0F8F83"/><circle cx="80" cy="222" r="13" fill="#0F8F83"/><circle cx="122" cy="284" r="13" fill="#E58F46"/>

      <line x1="248" y1="282" x2="286" y2="226" class="stable-line"/>
      <line x1="286" y1="226" x2="325" y2="280" class="muted-line"/>
      <circle cx="245" cy="286" r="13" fill="#0F8F83"/><circle cx="286" cy="222" r="13" fill="#0F8F83"/><circle cx="328" cy="284" r="13" fill="#A9C2CF"/>
    </g>
  </g>

  <text class="label" x="2067" y="807" text-anchor="middle">Evidence + stability</text>
  <text class="label" x="2067" y="869" text-anchor="middle">+ method support</text>

  <!-- 5. Consensus and exploration -->
  <text class="stage" x="2669" y="292" text-anchor="middle">CONSENSUS</text>
  <text class="stage" x="2669" y="350" text-anchor="middle">OUTPUT</text>

  <!-- Consensus regulatory network -->
  <g transform="translate(2484 388)">
    <line x1="70" y1="82" x2="182" y2="54" class="stable-line" marker-end="url(#small-arrow)"/>
    <line x1="185" y1="58" x2="295" y2="120" class="icon-line" marker-end="url(#small-arrow)"/>
    <line x1="70" y1="90" x2="122" y2="205" class="icon-line" marker-end="url(#small-arrow)"/>
    <line x1="125" y1="208" x2="260" y2="225" class="stable-line" marker-end="url(#small-arrow)"/>
    <line x1="297" y1="128" x2="263" y2="215" class="variable-line"/>
    <line x1="184" y1="61" x2="126" y2="198" class="muted-line" stroke-dasharray="18 16"/>

    <rect x="43" y="56" width="54" height="54" rx="8" fill="#123B56" transform="rotate(45 70 83)"/>
    <circle cx="187" cy="52" r="31" fill="#1B75A6"/>
    <circle cx="300" cy="124" r="31" fill="#E58F46"/>
    <rect x="98" y="182" width="54" height="54" rx="8" fill="#0F8F83" transform="rotate(45 125 209)"/>
    <circle cx="264" cy="227" r="31" fill="#7C6BC2"/>
  </g>
  <text class="label" x="2669" y="704" text-anchor="middle">Interactive network</text>

  <!-- Compact output glyphs -->
  <g transform="translate(2504 735)">
    <!-- trajectory -->
    <rect x="0" y="0" width="118" height="96" rx="18" fill="#EAF5FA" stroke="#90BDD1" stroke-width="5"/>
    <path d="M20 72 C42 22, 65 83, 98 30" class="icon-line" stroke-width="8"/>
    <!-- benchmark -->
    <rect x="145" y="0" width="118" height="96" rx="18" fill="#E8F6F4" stroke="#76B5A9" stroke-width="5"/>
    <rect x="167" y="53" width="18" height="25" rx="4" fill="#0F8F83"/>
    <rect x="195" y="35" width="18" height="43" rx="4" fill="#1B75A6"/>
    <rect x="223" y="19" width="18" height="59" rx="4" fill="#7C6BC2"/>
    <!-- perturbation -->
    <rect x="290" y="0" width="118" height="96" rx="18" fill="#FFF2E7" stroke="#E8AD76" stroke-width="5"/>
    <circle cx="322" cy="48" r="14" fill="#E58F46"/>
    <path d="M339 48 H382 M370 35 L384 48 L370 61" class="navy-line" stroke-width="8"/>
  </g>
  <text class="compact-label" x="2669" y="872" text-anchor="middle">Explore · benchmark</text>
  <text class="compact-label" x="2669" y="918" text-anchor="middle">Perturbation</text>

  <!-- Outcome ribbon -->
  <rect x="76" y="992" width="2848" height="138" rx="42" fill="#DDEFF6" stroke="#A7CDDD" stroke-width="5"/>
  <text class="footer" x="1500" y="1084" text-anchor="middle">From single-cell expression to stable, interpretable regulatory hypotheses</text>
</svg>
