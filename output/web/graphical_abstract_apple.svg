<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="10in" height="4in" viewBox="0 0 3000 1200"
     role="img" aria-labelledby="title description">
  <title id="title">GRNScope graphical abstract - minimal concept</title>
  <desc id="description">GRNScope validates and prepares single-cell data, runs multiple gene regulatory network inference methods, estimates bootstrap confidence, builds a consensus network, and provides interactive network, comparison, trajectory, benchmark, and perturbation views.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F5F7"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="core-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4FAFF"/>
    </linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="720" y1="580" x2="2288" y2="580">
      <stop offset="0" stop-color="#64D2FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <radialGradient id="blue-glow">
      <stop offset="0" stop-color="#64D2FF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#64D2FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="card-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity=".065"/>
    </filter>
    <filter id="soft-shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity=".07"/>
    </filter>
    <marker id="edge-arrow" markerWidth="24" markerHeight="18" refX="22" refY="9"
            orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 24 18">
      <path d="M1 1 L23 9 L1 17 Z" fill="#1D1D1F"/>
    </marker>
    <style>
      .title { font: 700 94px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; fill: #1D1D1F; letter-spacing: -2px; }
      .subtitle { font: 500 46px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; fill: #6E6E73; letter-spacing: -.5px; }
      .label { font: 600 54px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; fill: #1D1D1F; letter-spacing: -1px; }
      .module-label { font: 600 42px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; fill: #1D1D1F; letter-spacing: -.6px; }
      .output-title { font: 700 46px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; fill: #1D1D1F; letter-spacing: -.8px; }
      .pill-label { font: 600 36px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; fill: #48484A; }
      .input-name { font: 600 34px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; fill: #1D1D1F; }
      .input-meta { font: 500 30px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; fill: #6E6E73; }
      .input-option { font: 600 28px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; fill: #48484A; }
      .core-title { font: 700 48px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; fill: #1D1D1F; letter-spacing: -.8px; }
      .core-subtitle { font: 500 27px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; fill: #6E6E73; }
      .step-title { font: 650 35px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; fill: #1D1D1F; letter-spacing: -.4px; }
      .card { fill: #FFFFFF; }
      .network-line { fill: none; stroke: #0A84FF; stroke-width: 13; stroke-linecap: round; stroke-linejoin: round; }
      .stable-line { fill: none; stroke: #30B67A; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="3000" height="1200" fill="url(#background)"/>

  <!-- Quiet product header -->

  <!-- Floating cards -->
  <rect class="card" x="70" y="310" width="650" height="570" rx="64" filter="url(#card-shadow)"/>
  <rect x="790" y="255" width="1420" height="650" rx="76" fill="url(#core-fill)" filter="url(#card-shadow)"/>
  <rect class="card" x="2280" y="310" width="650" height="570" rx="64" filter="url(#card-shadow)"/>

  <!-- Browser chrome identifies the central panel as a web server -->
  <circle cx="850" cy="302" r="10" fill="#FF5F57"/>
  <circle cx="883" cy="302" r="10" fill="#FFBD2E"/>
  <circle cx="916" cy="302" r="10" fill="#28C840"/>
  <line x1="790" y1="345" x2="2210" y2="345" stroke="#E5E5EA" stroke-width="4"/>

  <!-- One continuous flow line -->
  <path d="M720 574 H2258 V562 L2288 580 L2258 598 V586 H720 Z"
        fill="url(#flow)" opacity=".72"/>

  <!-- Rebuilt input panel: primary expression matrix + quiet optional metadata -->
  <text class="output-title" x="115" y="385">Input data</text>

  <g transform="translate(90 425)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="350" height="365" rx="46" fill="#F9F9FB" stroke="#D2D2D7" stroke-width="5"/>
    <text class="input-name" x="175" y="55" text-anchor="middle">Expression matrix</text>
    <g transform="translate(48 88)" stroke="#FFFFFF" stroke-width="7">
      <rect x="0" y="0" width="45" height="45" rx="8" fill="#D9F1FB"/><rect x="52" y="0" width="45" height="45" rx="8" fill="#75C7E8"/><rect x="104" y="0" width="45" height="45" rx="8" fill="#0A84FF"/><rect x="156" y="0" width="45" height="45" rx="8" fill="#A7DFF3"/><rect x="208" y="0" width="45" height="45" rx="8" fill="#FF9F0A"/>
      <rect x="0" y="52" width="45" height="45" rx="8" fill="#37A6D5"/><rect x="52" y="52" width="45" height="45" rx="8" fill="#FF9F0A"/><rect x="104" y="52" width="45" height="45" rx="8" fill="#D9F1FB"/><rect x="156" y="52" width="45" height="45" rx="8" fill="#30B67A"/><rect x="208" y="52" width="45" height="45" rx="8" fill="#75C7E8"/>
      <rect x="0" y="104" width="45" height="45" rx="8" fill="#D9F1FB"/><rect x="52" y="104" width="45" height="45" rx="8" fill="#0A84FF"/><rect x="104" y="104" width="45" height="45" rx="8" fill="#FF9F0A"/><rect x="156" y="104" width="45" height="45" rx="8" fill="#A7DFF3"/><rect x="208" y="104" width="45" height="45" rx="8" fill="#30B67A"/>
      <rect x="0" y="156" width="45" height="45" rx="8" fill="#FF9F0A"/><rect x="52" y="156" width="45" height="45" rx="8" fill="#D9F1FB"/><rect x="104" y="156" width="45" height="45" rx="8" fill="#30B67A"/><rect x="156" y="156" width="45" height="45" rx="8" fill="#37A6D5"/><rect x="208" y="156" width="45" height="45" rx="8" fill="#D9F1FB"/>
    </g>
    <text class="input-meta" x="175" y="330" text-anchor="middle">Genes × Cells</text>
  </g>

  <g>
    <text class="input-meta" x="577.5" y="470" text-anchor="middle">Optional</text>
    <rect x="455" y="490" width="245" height="285" rx="34" fill="#F7F9FB"/>
    <line x1="475" y1="585" x2="680" y2="585" stroke="#E5E5EA" stroke-width="3"/>
    <line x1="475" y1="680" x2="680" y2="680" stroke="#E5E5EA" stroke-width="3"/>

    <path d="M477 547 C487 521 500 557 512 529" fill="none" stroke="#0A84FF" stroke-width="6" stroke-linecap="round"/>
    <text class="input-option" x="533" y="538" dominant-baseline="middle">Pseudotime</text>

    <circle cx="483" cy="626" r="8" fill="#8E7DE3"/><circle cx="503" cy="620" r="8" fill="#30B67A"/><circle cx="506" cy="640" r="8" fill="#FF9F0A"/><circle cx="486" cy="644" r="8" fill="#0A84FF"/>
    <text class="input-option" x="533" y="633" dominant-baseline="middle">Clusters</text>

    <line x1="483" y1="735" x2="493" y2="717" stroke="#48484A" stroke-width="5" stroke-linecap="round"/><line x1="497" y1="718" x2="507" y2="736" stroke="#48484A" stroke-width="5" stroke-linecap="round"/>
    <circle cx="481" cy="737" r="7" fill="#0A84FF"/><circle cx="495" cy="715" r="7" fill="#30B67A"/><circle cx="509" cy="739" r="7" fill="#FF9F0A"/>
    <text class="input-option" x="533" y="721">Reference</text>
    <text class="input-option" x="533" y="755">GRN</text>
  </g>

  <!-- Outcome-led explanation of the analysis -->
  <text class="core-title" x="1500" y="414" text-anchor="middle">Discover reproducible regulatory links</text>

  <!-- Step 1: validate and preprocess the expression matrix -->
  <g transform="translate(905 490)">
    <rect x="0" y="0" width="230" height="180" rx="40" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="5"/>
    <g transform="translate(29 28)" fill="#0A84FF">
      <rect x="0" y="0" width="34" height="34" rx="7"/><rect x="40" y="0" width="34" height="34" rx="7" opacity=".35"/><rect x="80" y="0" width="34" height="34" rx="7"/>
      <rect x="0" y="40" width="34" height="34" rx="7" opacity=".42"/><rect x="40" y="40" width="34" height="34" rx="7"/><rect x="80" y="40" width="34" height="34" rx="7" opacity=".55"/>
      <rect x="0" y="80" width="34" height="34" rx="7"/><rect x="40" y="80" width="34" height="34" rx="7" opacity=".35"/><rect x="80" y="80" width="34" height="34" rx="7"/>
    </g>
    <circle cx="176" cy="128" r="41" fill="#E9FAF5"/>
    <path d="M151 128 L170 147 L203 108" class="stable-line" stroke-width="13"/>
  </g>
  <text class="step-title" x="1020" y="733" text-anchor="middle">Prepare expression data</text>

  <!-- Step 2: rerun multiple inference methods on bootstrap resamples -->
  <g transform="translate(1293 490)">
    <rect x="0" y="0" width="100" height="180" rx="30" fill="#F2EFFF" stroke="#8E7DE3" stroke-width="5"/>
    <line x1="24" y1="128" x2="50" y2="69" stroke="#8E7DE3" stroke-width="8" marker-end="url(#edge-arrow)"/>
    <line x1="51" y1="70" x2="77" y2="129" stroke="#8E7DE3" stroke-width="8"/>
    <circle cx="22" cy="135" r="14" fill="#8E7DE3"/><rect x="39" y="50" width="23" height="23" rx="5" fill="#8E7DE3" transform="rotate(45 50.5 61.5)"/><circle cx="80" cy="136" r="14" fill="#8E7DE3"/>

    <rect x="115" y="0" width="100" height="180" rx="30" fill="#E9FAF5" stroke="#30B67A" stroke-width="5"/>
    <line x1="139" y1="69" x2="165" y2="129" stroke="#30B67A" stroke-width="8" marker-end="url(#edge-arrow)"/>
    <line x1="166" y1="130" x2="192" y2="70" stroke="#30B67A" stroke-width="8"/>
    <circle cx="137" cy="62" r="14" fill="#30B67A"/><circle cx="165" cy="136" r="14" fill="#30B67A"/><rect x="181" y="50" width="23" height="23" rx="5" fill="#30B67A" transform="rotate(45 192.5 61.5)"/>

    <rect x="230" y="0" width="100" height="180" rx="30" fill="#FFF4E7" stroke="#FF9F0A" stroke-width="5"/>
    <line x1="254" y1="130" x2="280" y2="70" stroke="#FF9F0A" stroke-width="8"/>
    <line x1="281" y1="71" x2="307" y2="130" stroke="#FF9F0A" stroke-width="8" marker-end="url(#edge-arrow)"/>
    <circle cx="252" cy="136" r="14" fill="#FF9F0A"/><circle cx="280" cy="63" r="14" fill="#FF9F0A"/><circle cx="310" cy="136" r="14" fill="#FF9F0A"/>
  </g>
  <text class="step-title" x="1458" y="733" text-anchor="middle">Infer networks</text>

  <!-- Step 3: rank edges by reproducibility and cross-method support -->
  <g transform="translate(1780 490)">
    <rect x="0" y="0" width="300" height="180" rx="40" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="5"/>

    <rect x="24" y="24" width="252" height="38" rx="19" fill="#F2F8F5"/>
    <circle cx="47" cy="43" r="8" fill="#30B67A"/><line x1="57" y1="43" x2="82" y2="43" stroke="#30B67A" stroke-width="6" stroke-linecap="round"/><circle cx="91" cy="43" r="8" fill="#30B67A"/>
    <rect x="116" y="33" width="126" height="20" rx="10" fill="#DCEFE8"/><rect x="116" y="33" width="113" height="20" rx="10" fill="#30B67A"/>

    <rect x="24" y="71" width="252" height="38" rx="19" fill="#F2F7FC"/>
    <circle cx="47" cy="90" r="8" fill="#0A84FF"/><line x1="57" y1="90" x2="82" y2="90" stroke="#0A84FF" stroke-width="6" stroke-linecap="round"/><circle cx="91" cy="90" r="8" fill="#0A84FF"/>
    <rect x="116" y="80" width="126" height="20" rx="10" fill="#DDECF8"/><rect x="116" y="80" width="91" height="20" rx="10" fill="#0A84FF"/>

    <rect x="24" y="118" width="252" height="38" rx="19" fill="#F5F5F7"/>
    <circle cx="47" cy="137" r="8" fill="#AEAEB2"/><line x1="57" y1="137" x2="82" y2="137" stroke="#AEAEB2" stroke-width="6" stroke-linecap="round"/><circle cx="91" cy="137" r="8" fill="#AEAEB2"/>
    <rect x="116" y="127" width="126" height="20" rx="10" fill="#E5E5EA"/><rect x="116" y="127" width="51" height="20" rx="10" fill="#AEAEB2"/>
  </g>
  <text class="step-title" x="1930" y="733" text-anchor="middle">Score each edge</text>

  <!-- Output panel mirrors the input panel: primary network + result views -->
  <text class="output-title" x="2325" y="385">Results</text>

  <g transform="translate(2300 425)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="350" height="365" rx="46" fill="#F9F9FB" stroke="#D2D2D7" stroke-width="5"/>
    <text class="input-name" x="175" y="55" text-anchor="middle">Consensus network</text>
    <g transform="translate(46 73) scale(.68)">
      <rect x="0" y="0" width="380" height="330" rx="48" fill="#F4F9FD"/>
      <line x1="82" y1="152" x2="188" y2="116" class="stable-line" marker-end="url(#edge-arrow)"/>
      <line x1="191" y1="117" x2="291" y2="181" class="network-line" marker-end="url(#edge-arrow)"/>
      <line x1="83" y1="158" x2="135" y2="270" class="network-line" marker-end="url(#edge-arrow)"/>
      <line x1="138" y1="272" x2="255" y2="285" class="stable-line" marker-end="url(#edge-arrow)"/>
      <line x1="291" y1="188" x2="258" y2="276" stroke="#FF9F0A" stroke-width="11" stroke-linecap="round" stroke-dasharray="18 15"/>
      <rect x="57" y="127" width="52" height="52" rx="9" fill="#1D1D1F" transform="rotate(45 83 153)"/>
      <circle cx="192" cy="112" r="30" fill="#0A84FF"/><circle cx="295" cy="184" r="30" fill="#FF9F0A"/>
      <rect x="112" y="247" width="52" height="52" rx="9" fill="#30B67A" transform="rotate(45 138 273)"/><circle cx="258" cy="287" r="30" fill="#8E7DE3"/>
    </g>
    <text class="input-meta" x="175" y="330" text-anchor="middle">Interactive GRN</text>
  </g>

  <g>
    <text class="input-meta" x="2787.5" y="470" text-anchor="middle">Explore</text>
    <rect x="2665" y="490" width="245" height="285" rx="34" fill="#F7F9FB"/>
    <line x1="2685" y1="562" x2="2890" y2="562" stroke="#E5E5EA" stroke-width="3"/>
    <line x1="2685" y1="633" x2="2890" y2="633" stroke="#E5E5EA" stroke-width="3"/>
    <line x1="2685" y1="704" x2="2890" y2="704" stroke="#E5E5EA" stroke-width="3"/>

    <path d="M2687 536 C2696 516 2707 545 2721 518" fill="none" stroke="#0A84FF" stroke-width="6" stroke-linecap="round"/>
    <text class="input-option" x="2742" y="526" dominant-baseline="middle">Trajectory</text>

    <rect x="2687" y="598" width="8" height="20" rx="4" fill="#8E7DE3"/><rect x="2700" y="589" width="8" height="29" rx="4" fill="#30B67A"/><rect x="2713" y="580" width="8" height="38" rx="4" fill="#0A84FF"/>
    <text class="input-option" x="2742" y="597" dominant-baseline="middle">Comparison</text>

    <circle cx="2704" cy="668" r="20" fill="none" stroke="#8E8E93" stroke-width="5"/><circle cx="2704" cy="668" r="10" fill="none" stroke="#0A84FF" stroke-width="5"/><circle cx="2704" cy="668" r="4" fill="#30B67A"/>
    <text class="input-option" x="2742" y="668" dominant-baseline="middle">Benchmark</text>

    <line x1="2690" y1="739" x2="2718" y2="722" stroke="#FF9F0A" stroke-width="5" stroke-linecap="round"/><line x1="2690" y1="739" x2="2718" y2="756" stroke="#FF9F0A" stroke-width="5" stroke-linecap="round"/>
    <circle cx="2688" cy="739" r="7" fill="#0A84FF"/><circle cx="2720" cy="721" r="7" fill="#30B67A"/><circle cx="2720" cy="757" r="7" fill="#FF9F0A"/>
    <text class="input-option" x="2742" y="739" dominant-baseline="middle">Perturbation</text>
  </g>

</svg>
