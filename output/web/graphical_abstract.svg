<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="10in" height="4in" viewBox="0 0 3000 1200"
     role="img" aria-labelledby="title desc">
  <title id="title">GRNScope simplified graphical abstract</title>
  <desc id="desc">Single-cell data enter GRNScope, where multiple methods, bootstrap resampling, and stability assessment produce an interactive consensus gene regulatory network.</desc>

  <defs>
    <marker id="flow-arrow" markerWidth="74" markerHeight="54" refX="68" refY="27"
            orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 74 54">
      <path d="M3 3 L71 27 L3 51 Z" fill="#1B75A6"/>
    </marker>
    <marker id="edge-arrow" markerWidth="28" markerHeight="22" refX="25" refY="11"
            orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 28 22">
      <path d="M1 1 L27 11 L1 21 Z" fill="#123B56"/>
    </marker>
    <style>
      .title { font: 700 92px Arial, Helvetica, sans-serif; fill: #123B56; }
      .label { font: 700 56px Arial, Helvetica, sans-serif; fill: #294A5D; }
      .panel { fill: #FFFFFF; stroke: #C9DFEA; stroke-width: 6; }
      .core { fill: #EAF5FA; stroke: #89BCD2; stroke-width: 7; }
      .line { fill: none; stroke: #123B56; stroke-width: 13; stroke-linecap: round; stroke-linejoin: round; }
      .blue-line { fill: none; stroke: #1B75A6; stroke-width: 13; stroke-linecap: round; stroke-linejoin: round; }
      .teal-line { fill: none; stroke: #0F8F83; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="3000" height="1200" fill="#F7FBFD"/>

  <!-- Minimal header -->
  <text class="title" x="1500" y="128" text-anchor="middle">GRNScope</text>
  <line x1="120" y1="178" x2="2880" y2="178" stroke="#BBD7E4" stroke-width="5"/>

  <!-- Three-part composition -->
  <rect class="panel" x="100" y="270" width="600" height="720" rx="46"/>
  <rect class="core" x="830" y="230" width="1340" height="800" rx="56"/>
  <rect class="panel" x="2300" y="270" width="600" height="720" rx="46"/>

  <!-- Main flow -->
  <line x1="726" y1="620" x2="800" y2="620" stroke="#1B75A6" stroke-width="20" marker-end="url(#flow-arrow)"/>
  <line x1="2196" y1="620" x2="2270" y2="620" stroke="#1B75A6" stroke-width="20" marker-end="url(#flow-arrow)"/>

  <!-- Input: expression matrix -->
  <g transform="translate(220 390)">
    <rect x="0" y="0" width="360" height="300" rx="30" fill="#EAF5FA" stroke="#89BCD2" stroke-width="8"/>
    <g stroke="#FFFFFF" stroke-width="7">
      <rect x="35" y="34" width="52" height="52" rx="6" fill="#D7ECF4"/>
      <rect x="91" y="34" width="52" height="52" rx="6" fill="#76B5CF"/>
      <rect x="147" y="34" width="52" height="52" rx="6" fill="#1B75A6"/>
      <rect x="203" y="34" width="52" height="52" rx="6" fill="#AED5E4"/>
      <rect x="259" y="34" width="52" height="52" rx="6" fill="#E58F46"/>

      <rect x="35" y="90" width="52" height="52" rx="6" fill="#3F91B6"/>
      <rect x="91" y="90" width="52" height="52" rx="6" fill="#E58F46"/>
      <rect x="147" y="90" width="52" height="52" rx="6" fill="#D7ECF4"/>
      <rect x="203" y="90" width="52" height="52" rx="6" fill="#0F8F83"/>
      <rect x="259" y="90" width="52" height="52" rx="6" fill="#76B5CF"/>

      <rect x="35" y="146" width="52" height="52" rx="6" fill="#D7ECF4"/>
      <rect x="91" y="146" width="52" height="52" rx="6" fill="#1B75A6"/>
      <rect x="147" y="146" width="52" height="52" rx="6" fill="#E58F46"/>
      <rect x="203" y="146" width="52" height="52" rx="6" fill="#AED5E4"/>
      <rect x="259" y="146" width="52" height="52" rx="6" fill="#0F8F83"/>

      <rect x="35" y="202" width="52" height="52" rx="6" fill="#E58F46"/>
      <rect x="91" y="202" width="52" height="52" rx="6" fill="#D7ECF4"/>
      <rect x="147" y="202" width="52" height="52" rx="6" fill="#0F8F83"/>
      <rect x="203" y="202" width="52" height="52" rx="6" fill="#3F91B6"/>
      <rect x="259" y="202" width="52" height="52" rx="6" fill="#D7ECF4"/>
    </g>
  </g>
  <text class="label" x="400" y="810" text-anchor="middle">Single-cell data</text>

  <!-- GRNScope core: multi-method -->
  <g transform="translate(930 400)">
    <rect x="0" y="0" width="130" height="190" rx="24" fill="#F0EEFA" stroke="#7C6BC2" stroke-width="7"/>
    <line x1="31" y1="135" x2="65" y2="66" stroke="#7C6BC2" stroke-width="11" marker-end="url(#edge-arrow)"/>
    <line x1="67" y1="68" x2="103" y2="137" stroke="#7C6BC2" stroke-width="11"/>
    <circle cx="28" cy="142" r="17" fill="#7C6BC2"/>
    <rect x="50" y="46" width="31" height="31" rx="5" fill="#7C6BC2" transform="rotate(45 65.5 61.5)"/>
    <circle cx="106" cy="143" r="17" fill="#7C6BC2"/>

    <rect x="150" y="0" width="130" height="190" rx="24" fill="#E8F6F4" stroke="#0F8F83" stroke-width="7"/>
    <line x1="180" y1="68" x2="215" y2="137" stroke="#0F8F83" stroke-width="11" marker-end="url(#edge-arrow)"/>
    <line x1="217" y1="137" x2="252" y2="68" stroke="#0F8F83" stroke-width="11"/>
    <circle cx="178" cy="61" r="17" fill="#0F8F83"/>
    <circle cx="216" cy="143" r="17" fill="#0F8F83"/>
    <rect x="238" y="46" width="31" height="31" rx="5" fill="#0F8F83" transform="rotate(45 253.5 61.5)"/>

    <rect x="300" y="0" width="130" height="190" rx="24" fill="#FFF2E7" stroke="#E58F46" stroke-width="7"/>
    <line x1="330" y1="140" x2="365" y2="67" stroke="#E58F46" stroke-width="11"/>
    <line x1="367" y1="68" x2="402" y2="139" stroke="#E58F46" stroke-width="11" marker-end="url(#edge-arrow)"/>
    <circle cx="328" cy="145" r="17" fill="#E58F46"/>
    <circle cx="366" cy="61" r="17" fill="#E58F46"/>
    <circle cx="405" cy="145" r="17" fill="#E58F46"/>
  </g>
  <text class="label" x="1145" y="745" text-anchor="middle">Multi-method</text>

  <!-- Internal flow -->
  <line x1="1375" y1="515" x2="1450" y2="515" stroke="#1B75A6" stroke-width="15" marker-end="url(#flow-arrow)"/>

  <!-- Bootstrap icon -->
  <g transform="translate(1500 395)">
    <rect x="0" y="0" width="210" height="170" rx="24" fill="#FFFFFF" stroke="#89BCD2" stroke-width="7"/>
    <g fill="#1B75A6">
      <rect x="31" y="30" width="34" height="34" rx="6"/><rect x="70" y="30" width="34" height="34" rx="6" opacity=".4"/><rect x="109" y="30" width="34" height="34" rx="6"/>
      <rect x="31" y="69" width="34" height="34" rx="6" opacity=".4"/><rect x="70" y="69" width="34" height="34" rx="6"/><rect x="109" y="69" width="34" height="34" rx="6" opacity=".6"/>
      <rect x="31" y="108" width="34" height="34" rx="6"/><rect x="70" y="108" width="34" height="34" rx="6" opacity=".5"/><rect x="109" y="108" width="34" height="34" rx="6"/>
    </g>
    <path d="M164 51 C198 72 201 115 168 136" class="blue-line" stroke-width="10" marker-end="url(#edge-arrow)"/>
  </g>
  <text class="label" x="1605" y="745" text-anchor="middle">Bootstrap</text>

  <!-- Internal flow -->
  <line x1="1755" y1="515" x2="1830" y2="515" stroke="#1B75A6" stroke-width="15" marker-end="url(#flow-arrow)"/>

  <!-- Stability icon -->
  <g transform="translate(1880 370)">
    <path d="M125 0 L235 45 V142 C235 228 182 283 125 312 C68 283 15 228 15 142 V45 Z"
          fill="#FFFFFF" stroke="#0F8F83" stroke-width="9"/>
    <path d="M64 151 L108 195 L191 102" class="teal-line" stroke-width="21"/>
  </g>
  <text class="label" x="2005" y="745" text-anchor="middle">Stability</text>

  <!-- Output: browser-framed consensus network -->
  <g transform="translate(2390 365)">
    <rect x="0" y="0" width="420" height="390" rx="30" fill="#FFFFFF" stroke="#89BCD2" stroke-width="8"/>
    <path d="M0 72 H420" stroke="#C9DFEA" stroke-width="7"/>
    <circle cx="40" cy="36" r="11" fill="#E58F46"/>
    <circle cx="74" cy="36" r="11" fill="#E7C15D"/>
    <circle cx="108" cy="36" r="11" fill="#76B5A9"/>

    <line x1="100" y1="157" x2="212" y2="121" class="teal-line" marker-end="url(#edge-arrow)"/>
    <line x1="215" y1="123" x2="322" y2="190" class="blue-line" marker-end="url(#edge-arrow)"/>
    <line x1="101" y1="164" x2="156" y2="284" class="blue-line" marker-end="url(#edge-arrow)"/>
    <line x1="159" y1="286" x2="284" y2="301" class="teal-line" marker-end="url(#edge-arrow)"/>
    <line x1="321" y1="198" x2="287" y2="293" stroke="#E58F46" stroke-width="11" stroke-dasharray="18 15"/>

    <rect x="73" y="132" width="54" height="54" rx="8" fill="#123B56" transform="rotate(45 100 159)"/>
    <circle cx="216" cy="117" r="31" fill="#1B75A6"/>
    <circle cx="326" cy="194" r="31" fill="#E58F46"/>
    <rect x="132" y="260" width="54" height="54" rx="8" fill="#0F8F83" transform="rotate(45 159 287)"/>
    <circle cx="287" cy="303" r="31" fill="#7C6BC2"/>
  </g>
  <text class="label" x="2600" y="850" text-anchor="middle">Consensus GRN</text>

  <!-- Three unlabeled exploration controls -->
  <g transform="translate(2425 890)">
    <rect x="0" y="0" width="120" height="74" rx="18" fill="#EAF5FA" stroke="#89BCD2" stroke-width="5"/>
    <path d="M22 55 C44 12 68 65 100 25" class="blue-line" stroke-width="8"/>

    <rect x="145" y="0" width="120" height="74" rx="18" fill="#E8F6F4" stroke="#76B5A9" stroke-width="5"/>
    <rect x="171" y="42" width="17" height="18" rx="3" fill="#0F8F83"/>
    <rect x="198" y="26" width="17" height="34" rx="3" fill="#1B75A6"/>
    <rect x="225" y="12" width="17" height="48" rx="3" fill="#7C6BC2"/>

    <rect x="290" y="0" width="120" height="74" rx="18" fill="#FFF2E7" stroke="#E8AD76" stroke-width="5"/>
    <circle cx="319" cy="37" r="12" fill="#E58F46"/>
    <path d="M338 37 H385 M373 25 L387 37 L373 49" class="line" stroke-width="8"/>
  </g>
</svg>
